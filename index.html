<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buzz Tools — small free utilities that run in your browser</title>
<meta name="description" content="A growing portal of small, free, client-side utilities: word games, converters, and more. No accounts, no installs, nothing uploaded.">
<link rel="stylesheet" href="portal.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="home">
    <section class="hero">
      <h1>Small tools, no strings.</h1>
      <p class="tagline">A growing set of free utilities that run entirely in your browser — nothing to install, and your input never leaves your machine.</p>
    </section>

    <section id="tool-grid" class="tool-grid" aria-label="Available tools"></section>
  </main>

  <noscript><p class="no-js">This portal needs JavaScript to list and run its tools.</p></noscript>
  <footer id="site-footer"></footer>

  <script src="portal.js"></script>
</body>
</html>
