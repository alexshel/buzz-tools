<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Unscrambler</title>
  <link rel="stylesheet" href="../../portal.css">
<style>
  /* page chrome (tokens, body base, .card, h1, .subtitle, button,
     .status, .foot) comes from the shared base in portal.css. `form`
     stays here: only the word tools use the flex stack — the calculator
     pages lay out with .form-grid, so the base must not force one. */
  form { display: flex; flex-direction: column; gap: 12px; }

  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.15rem;
    font-weight: 500;
    text-align: center;
    letter-spacing: 0.04em;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    outline: none;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  input::placeholder {
    color: var(--ink-soft);
    font-weight: 400;
    letter-spacing: 0;
    opacity: 0.75;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
  }


  #results { margin-top: 24px; border-top: 1px solid var(--rule); padding-top: 20px; }
  #results p { margin: 0; }
  #results .count {
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 20px;
    color: var(--ink-soft);
  }
  #results .words {
    font-size: 1.1rem;
    line-height: 2.2;
    word-spacing: 0.6em;
    font-weight: 500;
    color: var(--ink);
  }

  /* Word buttons with copy functionality */
  .word-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px 2px 2px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
    font-weight: 500;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 120ms ease, transform 80ms ease;
  }
  .word-btn:hover,
  .word-btn:focus-visible {
    background: var(--accent);
    color: var(--accent-ink);
    outline: none;
  }
  .word-btn:focus-visible {
    box-shadow: 0 0 0 2px var(--ring);
  }
  .word-btn:active {
    transform: scale(0.97);
  }
  .word-btn .word-text {
    /* Normal text, inherits color from button */
  }
  .word-btn:hover .word-text,
  .word-btn:focus-visible .word-text {
    color: var(--accent-ink);
  }
  .word-btn .copy-icon {
    flex-shrink: 0;
    opacity: 0;
    color: var(--ink-soft);
    transition: opacity 120ms ease, color 120ms ease;
  }
  .word-btn:hover .copy-icon,
  .word-btn:focus-visible .copy-icon {
    opacity: 1;
    color: var(--accent-ink);
  }
  .word-btn.copied .copy-icon {
    opacity: 1;
    color: #22c55e;
  }
  .word-btn.copied .word-text {
    color: #22c55e;
  }

  #results .meta {
    margin-top: 16px;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  #results.empty .words, #results:not(.has-result) .words,
  #results:not(.has-result) .meta { display: none; }


</style>
</head>
<body class="tool-page tool-page--center">
  <header id="site-header"></header>
  <main class="card">
    <h1>Word Unscrambler</h1>
    <p class="subtitle">Type any set of letters and we&rsquo;ll list every word you can spell with them &mdash; longest first.</p>

    <form id="form" autocomplete="off">
      <label for="letters" hidden>Letters</label>
      <input id="letters" name="letters"
             placeholder="e.g. atc"
             maxlength="64"
             spellcheck="false"
             autocomplete="off"
             autocapitalize="off"
             autofocus>
      <button id="submit" type="submit">Submit</button>
    </form>

    <p id="status" class="status"></p>
    <section id="results" aria-live="polite"></section>

    <p class="foot">370k-word dictionary &middot; everything runs in your browser</p>
  </main>

  <noscript><p style="text-align:center;padding:20px">This tool needs JavaScript enabled.</p></noscript>
  <script src="unscramble.js"></script>
  <script>Unscramble.init(document);</script>
  <script src="../../portal.js"></script>
</body>
</html>
