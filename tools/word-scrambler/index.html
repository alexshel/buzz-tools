<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Scrambler</title>
<link rel="stylesheet" href="../../portal.css">
<style>
  /* page chrome (tokens, body base, .card, h1, .subtitle, button,
     .foot) comes from the shared base in portal.css. `form` stays
     here: only the word tools use the flex stack — the calculator
     pages lay out with .form-grid, so the base must not force one. */
  form { display: flex; flex-direction: column; gap: 12px; }

  textarea {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    outline: none;
    resize: vertical;
    min-height: 80px;
    font-family: inherit;
    transition: border-color 120ms ease, box-shadow 120ms ease;
  }
  textarea::placeholder {
    color: var(--ink-soft);
    font-weight: 400;
    opacity: 0.75;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
  }

  .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  button { padding: 13px 24px; }
  label.check-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.92rem;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  label.check-row input[type="checkbox"] {
    width: 16px;
    height: 16px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  #output {
    margin-top: 24px;
    border-top: 1px solid var(--rule);
    padding-top: 20px;
    display: none;
    flex-direction: column;
    gap: 14px;
  }
  #output.has-result { display: flex; }

  #result-text {
    margin: 0;
    font-size: 1.4rem;
    line-height: 1.6;
    font-weight: 600;
    letter-spacing: 0.02em;
    word-break: break-word;
    color: var(--ink);
  }

  #actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }


  @media (max-width: 520px) {
    #result-text { font-size: 1.2rem; }
  }
</style>
</head>
<body class="tool-page tool-page--center">
  <header id="site-header"></header>
  <main class="card">
    <h1>Word Scrambler</h1>
    <p class="subtitle">Enter any word or phrase and we&rsquo;ll scramble the letters &mdash; great for puzzles, games, or a quick brain-teaser.</p>

    <form id="form" autocomplete="off">
      <label for="phrase" hidden>Phrase</label>
      <textarea id="phrase" name="phrase"
                placeholder="e.g. the quick brown fox"
                spellcheck="false"
                autocomplete="off"
                maxlength="500"></textarea>

      <div class="row">
        <button id="submit" type="submit">Scramble</button>
        <label class="check-row">
          <input type="checkbox" id="keep-ends" checked>
          Keep first &amp; last letter
        </label>
      </div>
    </form>

    <section id="output" aria-live="polite">
      <p id="result-text"></p>
      <div id="actions">
        <button id="rescramble" class="btn-ghost" type="button">&#x21bb;&nbsp; Re-scramble</button>
        <button id="copy-btn" class="btn-ghost" type="button">Copy</button>
      </div>
    </section>

    <p class="foot">All scrambling happens in your browser &middot; nothing is sent to a server</p>
  </main>

  <noscript><p style="text-align:center;padding:20px">This tool needs JavaScript enabled.</p></noscript>
  <script src="scramble.js"></script>
  <script>Scramble.init(document);</script>
  <script src="../../portal.js"></script>
</body>
</html>
